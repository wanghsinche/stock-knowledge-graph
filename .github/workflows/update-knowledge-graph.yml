name: Stock Knowledge Graph Update

on:
  schedule:
    - cron: '0 16 * * 1-fri'
  workflow_dispatch:
  repository_dispatch:

permissions:
  contents: write

env:
  NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install UV
        uses: astral-sh/setup-uv@v4

      - name: Create venv and install deps
        run: |
          uv venv
          uv pip install -e .

      - name: Run knowledge graph generator
        run: |
          uv run knowledge_graph/scripts/extract_relationships.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git status
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update stock knowledge graph - Automated update of industry relationships"
            git push
          fi

      - name: Notify on failure
        if: failure()
        run: |
          echo "Knowledge graph update failed!"
